[package]
name = "stickynotes-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "stickynotes"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
markdown-editor.workspace = true
stickynotes-core.workspace = true
uuid.workspace = true
anyhow.workspace = true
futures = "0.3"
raw-window-handle = "0.6"

# Only features the UI toolkit already enables: the tray icon, the hidden
# main window and the single-instance guard need nothing beyond them.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
resvg = { version = "0.46", default-features = false }
