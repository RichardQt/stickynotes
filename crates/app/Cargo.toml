[package]
name = "stickynotes-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "stickynotes"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
markdown-editor.workspace = true
stickynotes-core.workspace = true
uuid.workspace = true
anyhow.workspace = true
futures = "0.3"
raw-window-handle = "0.6"

# Only features the UI toolkit already enables: the tray icon and its menu,
# the system-wide shortcut, the hidden main window and the single-instance
# guard need nothing beyond them.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The "start with Windows" entry. Already built for the UI toolkit.
windows-registry = "0.6"

[dev-dependencies]
# The paste tests drive a real editor with gpui's fake clipboard.
gpui-kit = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
resvg = { version = "0.46", default-features = false }
